name: CI

on:
  pull_request:
  # Every branch, not just main. The projection invariant guards against a
  # change that silently empties a production table, so it should report on a
  # feature branch the moment the commit lands — not first at PR-open time.
  # Cost: a branch with an open PR runs CI twice (push + pull_request).
  push:

# Every job checks this repo out into ./lead-engine-crm and the contracts package
# into ./syncore-contracts, because `@syncore/contracts` is installed as
# `file:../syncore-contracts`. See .github/actions/setup-with-contracts.

jobs:
  projection-invariant:
    # CRM-0 guardrail. Deliberately its OWN job, and deliberately first.
    #
    # Golden rule 1 (blob-projected XOR Prisma-native) is the one rule whose
    # violation destroys production data silently: adding a Growth OS table to
    # persistence-projection.ts puts it in upsertOrder's blast radius, where
    # deleteMany({ where: { workspaceId, id: { notIn: ids } } }) empties it on the
    # next sync with no error and no log line.
    #
    # Because of that, its verdict must never be maskable. Inside `validate` a
    # lint or typecheck failure short-circuits the job and the invariant is simply
    # never evaluated — "not run" and "passed" look identical in a red build. As a
    # separate job it always runs, always reports, and cannot be starved by an
    # unrelated failure elsewhere in the matrix.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_engine_crm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: lead-engine-crm

      # Runs on a bare checkout, before any install and before the contracts
      # sibling exists. The checker has zero dependencies (node: builtins only),
      # so neither a broken lockfile, an expired contracts token, nor a registry
      # outage can stop it from reporting.
      - name: Projection invariant
        working-directory: lead-engine-crm
        run: node scripts/check-projection-invariant.mjs

      - name: Setup
        uses: ./lead-engine-crm/.github/actions/setup-with-contracts
        with:
          contracts-token: ${{ secrets.CONTRACTS_READ_TOKEN }}

      # Proves the checker above is still ARMED. A no-op'd matcher reports
      # "✓ free of all guarded models" and exits 0 — indistinguishable from a
      # clean repo. This meta-test is what tells the two apart, so it gets the
      # same isolation from lint/typecheck that the checker does.
      - name: Projection invariant is armed
        working-directory: lead-engine-crm
        run: npx vitest run tests/unit/projection-invariant.test.ts

  validate:
    runs-on: ubuntu-latest
    env:
      # `prisma validate` evaluates env("DATABASE_URL") in the datasource block,
      # so it must be defined even though this job never connects to a database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_engine_crm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: lead-engine-crm

      - name: Setup
        uses: ./lead-engine-crm/.github/actions/setup-with-contracts
        with:
          contracts-token: ${{ secrets.CONTRACTS_READ_TOKEN }}

      - name: Validate Prisma schema
        working-directory: lead-engine-crm
        run: npm run prisma:validate

      - name: Generate Prisma client
        working-directory: lead-engine-crm
        run: npm run prisma:generate

      - name: Lint
        working-directory: lead-engine-crm
        run: npm run lint

      - name: Typecheck
        working-directory: lead-engine-crm
        run: npm run typecheck

      - name: Unit tests
        working-directory: lead-engine-crm
        run: npm run test

  build:
    runs-on: ubuntu-latest
    env:
      # `next build` sets NODE_ENV=production, but the production build phase is
      # detected (npm_lifecycle_event=build), so the fail-closed secret guards
      # use their dev defaults during the build. Prisma client construction is
      # lazy and does not connect, so this URL only needs to parse.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_engine_crm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: lead-engine-crm

      - name: Setup
        uses: ./lead-engine-crm/.github/actions/setup-with-contracts
        with:
          contracts-token: ${{ secrets.CONTRACTS_READ_TOKEN }}

      - name: Generate Prisma client
        working-directory: lead-engine-crm
        run: npm run prisma:generate

      - name: Build
        working-directory: lead-engine-crm
        run: npm run build

  integration:
    # Real-Postgres round-trip so AppState-projection/schema drift is caught
    # (the unit lane stubs Prisma in-memory and cannot see drift). Isolated from
    # the fast unit job so a DB hiccup never flakes the unit lane.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_engine_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_engine_crm
      SYNCORE_STORAGE_DRIVER: prisma
      SYNCORE_RUN_DB_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: lead-engine-crm

      - name: Setup
        uses: ./lead-engine-crm/.github/actions/setup-with-contracts
        with:
          contracts-token: ${{ secrets.CONTRACTS_READ_TOKEN }}

      - name: Generate Prisma client
        working-directory: lead-engine-crm
        run: npm run prisma:generate

      - name: Apply migrations
        working-directory: lead-engine-crm
        run: npm run prisma:migrate:deploy

      - name: Integration tests (real Postgres)
        working-directory: lead-engine-crm
        run: npm run test:integration

  e2e:
    # Playwright smoke suite. Runs against `next dev` on the PRISMA driver + a
    # postgres:16 service (matching prod), seeded via db:seed (native tables +
    # snapshot). The file storage driver is being retired (blob migration), so
    # e2e now exercises the same storage path as production.
    #
    # Informational for now: the smoke step uses step-level continue-on-error so
    # failures are surfaced in the logs but do not fail the job/block the merge,
    # because the suite is not yet stable in CI (mobile responsive-overflow +
    # SDR-scoped routing). Remove continue-on-error to make it blocking once green.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_engine_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lead_engine_crm
      SYNCORE_STORAGE_DRIVER: prisma
      # Lets db:seed write the AppStateSnapshot (readStateFromPrisma needs it) and
      # keeps the dev server from refusing to auto-seed.
      SYNCORE_SEED_SNAPSHOT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: lead-engine-crm

      - name: Setup
        uses: ./lead-engine-crm/.github/actions/setup-with-contracts
        with:
          contracts-token: ${{ secrets.CONTRACTS_READ_TOKEN }}

      - name: Generate Prisma client
        working-directory: lead-engine-crm
        run: npm run prisma:generate

      - name: Apply migrations
        working-directory: lead-engine-crm
        run: npm run prisma:migrate:deploy

      - name: Seed Prisma (native tables + snapshot)
        working-directory: lead-engine-crm
        run: npm run db:seed

      - name: Install Playwright browser
        working-directory: lead-engine-crm
        run: npx playwright install --with-deps chromium

      # LEGACY, advisory only. `continue-on-error` means failures here are logged
      # and ignored, so a green `e2e` job does NOT certify these passed. The
      # suite is unstable in CI (mobile responsive-overflow + SDR-scoped
      # routing); stabilising it is its own piece of work.
      #
      # Growth OS specs are excluded here and run blocking in the step below.
      - name: Smoke tests (legacy, advisory)
        continue-on-error: true
        working-directory: lead-engine-crm
        run: npx playwright test --grep-invert "Growth OS"

      # BLOCKING. Everything built from CRM-1 onward gets real enforcement:
      # if this fails, the job fails. A test that cannot fail the build is
      # documentation, not a test.
      - name: Growth OS e2e (blocking)
        working-directory: lead-engine-crm
        run: npx playwright test --grep "Growth OS"
